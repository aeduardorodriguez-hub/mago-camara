<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Buscador</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></symbol>
  <symbol id="i-lens" viewBox="0 0 24 24"><path d="M9.4 12a2.6 2.6 0 1 1 5.2 0 2.6 2.6 0 0 1-5.2 0zM20 5h-3.2L15 3H9L7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-8 13.2a6.2 6.2 0 1 1 0-12.4 6.2 6.2 0 0 1 0 12.4z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  <symbol id="i-hist" viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M6.4 6.4v1.9h8.1L5.4 17.4l1.3 1.3 9.1-9.1v8.1h1.9V6.4z"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><path d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 12c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0-6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM16 6c0 1.1.9 2 2 2s2-.9 2-2-.9-2-2-2-2 .9-2 2zm-4 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></symbol>
</defs></svg>

<!-- INICIO -->
<div id="home" class="view">
  <header class="h-top"><a class="lnk">Imágenes</a><svg class="ic apps"><use href="#i-apps"/></svg><button class="signin" type="button">Acceder</button></header>
  <main class="h-mid">
    <h1 class="logo" id="logo"></h1>
    <form class="pill" id="f1" autocomplete="off" role="search">
      <svg class="ic l"><use href="#i-search"/></svg>
      <input id="q1" type="text" inputmode="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Buscar">
      <svg class="ic r mic"><use href="#i-mic"/></svg><svg class="ic r lens"><use href="#i-lens"/></svg>
      <ul class="sug" id="s1"></ul>
    </form>
    <div class="btns"><button type="submit" form="f1">Buscar</button><button type="button" id="lucky">Voy a tener suerte</button></div>
  </main>
  <footer class="foot"><div>Privacidad</div><div>Condiciones</div><div>Configuración</div></footer>
</div>

<!-- RESULTADOS -->
<div id="serp" class="view" hidden>
  <header class="s-top">
    <form class="pill sm" id="f2" autocomplete="off" role="search">
      <button type="button" class="ib" id="sback" aria-label="Atrás"><svg class="ic"><use href="#i-back"/></svg></button>
      <input id="q2" type="text" inputmode="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Buscar">
      <button type="button" class="ib" id="qclear" aria-label="Borrar"><svg class="ic"><use href="#i-close"/></svg></button>
      <svg class="ic r mic"><use href="#i-mic"/></svg>
      <ul class="sug" id="s2"></ul>
    </form>
  </header>
  <nav class="tabs" id="tabs"><a class="on" data-t="all">Todo</a><a data-t="img">Imágenes</a><a data-t="vid">Videos</a><a data-t="news">Noticias</a><a data-t="maps">Maps</a><a data-t="books">Libros</a></nav>
  <main id="serpBody"></main>
</div>

<!-- PÁGINA DEL CALENDARIO -->
<div id="site" class="view" hidden>
  <div class="sbar"><button type="button" class="ib" id="tback" aria-label="Atrás"><svg class="ic"><use href="#i-back"/></svg></button><b id="sname"></b><span class="sdots">⋮</span></div>
  <article class="sbody">
    <h1 id="stitle"></h1>
    <p class="lead" id="slead"></p>
    <div class="ynav"><button type="button" id="prev" aria-label="Año anterior">‹</button><span id="syear"></span><button type="button" id="next" aria-label="Año siguiente">›</button></div>
    <div class="months" id="months"></div>
    <p class="sfoot" id="sfoot"></p>
  </article>
</div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="emitter.js"></script>
</body>
</html>
