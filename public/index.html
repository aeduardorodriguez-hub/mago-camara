<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Buscador</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="home" class="view">
  <div class="home-top"><a>Gmail</a><a>Imágenes</a><span class="apps">⋮⋮⋮</span></div>
  <div class="home-mid">
    <h1 class="brand" id="brand"></h1>
    <form class="sbox" id="f1" autocomplete="off" role="search">
      <svg viewBox="0 0 24 24" class="ic"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <input id="q1" type="search" name="q" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Buscar">
      <ul class="sug" id="s1"></ul>
    </form>
    <div class="btns"><button form="f1" type="submit">Buscar</button><button type="button" id="lucky">Voy a tener suerte</button></div>
  </div>
  <div class="foot">Buscador © 2026</div>
</div>

<div id="res" class="view" hidden>
  <header class="rtop">
    <b class="brand sm" id="brand2"></b>
    <form class="sbox slim" id="f2" autocomplete="off" role="search">
      <input id="q2" type="search" name="q" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Buscar">
      <ul class="sug" id="s2"></ul>
    </form>
  </header>
  <nav class="tabs"><a class="on">Todo</a><a>Imágenes</a><a>Videos</a><a>Noticias</a><a>Maps</a><a>Más</a></nav>
  <div class="stats" id="stats"></div>
  <article class="card">
    <div class="card-h"><button id="prev" aria-label="Año anterior">‹</button><h2 id="title"></h2><button id="next" aria-label="Año siguiente">›</button></div>
    <div class="months" id="months"></div>
  </article>
  <section class="related"><h3>Búsquedas relacionadas</h3><ul id="rel"></ul></section>
</div>
<script src="/shared.js"></script>
<script src="/emitter.js"></script>
</body>
</html>
